<script>
(function () {
  'use strict';

  var POLL_MS = 3000;
  var state = {
    jobs: [],
    selectedJobId: '',
    candidates: [],
    evaluations: [],
    queueStatus: null,
    pollTimer: null,
    modelsLoaded: false,
    processingPhase: 'idle',
    evalTracking: false,
    knownEvalIds: {}
  };

  function run(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok === false) {
            resolve(res);
            return;
          }
          resolve(res && res.data !== undefined ? res.data : res);
        })
        .withFailureHandler(function (err) {
          reject(new Error(err && err.message ? err.message : String(err)));
        });
      runner[fnName].apply(runner, args);
    });
  }

  var API = {
    bootstrapApp: function () { return run('bootstrapApp'); },
    listJobs: function () { return run('listJobs'); },
    createJob: function (payload) { return run('createJob', payload); },
    importResumesForJob: function (jobId) { return run('importResumesForJob', jobId); },
    getCandidatesForJob: function (jobId) { return run('getCandidatesForJob', jobId); },
    startAnalysis: function (jobId) { return run('startAnalysis', jobId); },
    getQueueStatus: function (jobId) { return run('getQueueStatus', jobId); },
    getRankedEvaluations: function (jobId) { return run('getRankedEvaluations', jobId); },
    listOpenRouterModels: function (forceRefresh, freeOnly) {
      return run('listOpenRouterModels', forceRefresh === true, freeOnly === true, '');
    },
    getEvaluationModel: function () { return run('getEvaluationModel'); },
    setEvaluationModel: function (modelId) { return run('setEvaluationModel', modelId); },
    repairTriggers: function () { return run('repairTriggers'); },
    processQueueNow: function () { return run('processQueueNow'); },
    reprocessFailedQueue: function (jobId) { return run('reprocessFailedQueue', jobId); }
  };

  function $(id) { return document.getElementById(id); }

  function showToast(message, isError) {
    var el = $('toast');
    el.textContent = message;
    el.className = 'fixed bottom-4 right-4 max-w-sm text-sm px-4 py-3 rounded-lg shadow-lg z-50 ' +
      (isError ? 'arm-toast-error' : 'arm-toast-ok');
    el.classList.remove('hidden');
    setTimeout(function () { el.classList.add('hidden'); }, 4500);
  }

  function setLoading(show, text) {
    $('loading-overlay').classList.toggle('hidden', !show);
    if (text) $('loading-text').textContent = text;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function scoreBadgeClass(score) {
    var s = Number(score);
    if (s >= 4) return 'arm-score-lg score-badge-high';
    if (s >= 3) return 'arm-score-lg score-badge-mid';
    return 'arm-score-lg score-badge-low';
  }

  function scoreBarColor(score) {
    var s = Number(score);
    if (s >= 4) return '#059669';
    if (s >= 3) return '#d97706';
    return '#dc2626';
  }

  function isQueueActive(counts) {
    if (!counts) return false;
    var p = counts.parse || {};
    var e = counts.evaluate || {};
    return (p.pending || 0) + (p.processing || 0) + (e.pending || 0) + (e.processing || 0) > 0;
  }

  function bucketStats(bucket, fallbackTotal) {
    bucket = bucket || {};
    var completed = bucket.completed || 0;
    var failed = bucket.failed || 0;
    var active = (bucket.pending || 0) + (bucket.processing || 0);
    var total = completed + failed + active;
    if (fallbackTotal > total) total = fallbackTotal;
    var processed = Math.min(completed, total);
    var remaining = Math.max(0, total - processed - failed);
    return { total: total, processed: processed, failed: failed, remaining: remaining, active: active };
  }

  function detectPhase(qs) {
    if (!qs) return 'idle';
    var parse = qs.counts && qs.counts.parse ? qs.counts.parse : {};
    var evaluate = qs.counts && qs.counts.evaluate ? qs.counts.evaluate : {};
    if ((parse.pending || 0) + (parse.processing || 0) > 0) return 'parse';
    if ((evaluate.pending || 0) + (evaluate.processing || 0) > 0) return 'evaluate';
    if (state.evalTracking && qs.candidates_parsed > state.evaluations.length) return 'evaluate';
    if (qs.candidates_parsing > 0) return 'parse';
    return 'idle';
  }

  function shouldPoll() {
    if (!state.selectedJobId) return false;
    if (state.processingPhase !== 'idle') return true;
    if (state.evalTracking) return true;
    var qs = state.queueStatus;
    if (!qs) return false;
    if (isQueueActive(qs.counts)) return true;
    if (qs.candidates_parsing > 0) return true;
    return false;
  }

  function renderProcessingBanner() {
    var banner = $('processing-banner');
    var qs = state.queueStatus;
    var phase = detectPhase(qs);
    state.processingPhase = phase;

    if (phase === 'idle' || !state.selectedJobId) {
      banner.classList.add('hidden');
      if (phase === 'idle') state.evalTracking = false;
      return;
    }

    banner.classList.remove('hidden');
    banner.classList.toggle('evaluating', phase === 'evaluate');

    var bar = $('overall-progress-bar');
    bar.classList.toggle('evaluating', phase === 'evaluate');

    var parseStats = bucketStats(qs.counts.parse, qs.candidates_total || 0);
    var evalStats = bucketStats(qs.counts.evaluate, qs.candidates_parsed || 0);
    var stats = phase === 'parse' ? parseStats : evalStats;
    var pct = stats.total ? Math.round((stats.processed / stats.total) * 100) : 0;

    $('processing-headline').textContent = phase === 'parse'
      ? 'Parsing resume ' + Math.min(stats.processed + 1, stats.total) + ' of ' + stats.total + '…'
      : 'Evaluating candidate ' + Math.min(stats.processed + 1, stats.total) + ' of ' + stats.total + '…';

    $('processing-subline').textContent = phase === 'parse'
      ? 'Extracting text and contact info from uploaded resumes.'
      : 'AI is scoring candidates against the job description. Results appear below as they finish.';

    $('overall-progress-bar').style.width = pct + '%';
    $('overall-progress-pct').textContent = pct + '%';

    var statsHtml = '';
    statsHtml += '<span class="arm-stat-pill success">' + stats.processed + ' processed</span>';
    statsHtml += '<span class="arm-stat-pill">' + stats.remaining + ' remaining</span>';
    if (stats.failed) {
      statsHtml += '<span class="arm-stat-pill failed">' + stats.failed + ' failed</span>';
    }
    statsHtml += '<span class="arm-stat-pill">' + stats.total + ' total</span>';
    $('processing-stats').innerHTML = statsHtml;
  }

  function updateAnalyzeHint() {
    var hint = $('analyze-hint');
    var btn = $('btn-analyze');
    if (!state.selectedJobId) {
      hint.textContent = '';
      btn.disabled = true;
      return;
    }
    var parsed = state.candidates.filter(function (c) {
      return String(c.parsed_text || '').trim() !== '';
    }).length;
    var unparsed = state.candidates.length - parsed;
    if (!state.candidates.length) {
      hint.textContent = 'Import resumes before analyzing.';
      btn.disabled = true;
      return;
    }
    if (state.processingPhase === 'parse' || unparsed > 0 && state.processingPhase !== 'idle') {
      hint.textContent = 'Parsing in progress… ' + parsed + ' ready so far.';
      btn.disabled = true;
      return;
    }
    if (!parsed) {
      hint.textContent = unparsed + ' candidate(s) still parsing…';
      btn.disabled = true;
      return;
    }
    hint.textContent = parsed + ' ready' + (unparsed ? ', ' + unparsed + ' still parsing' : '') + '.';
    btn.disabled = state.processingPhase === 'evaluate';
  }

  function renderJobs() {
    var select = $('job-select');
    var current = select.value;
    select.innerHTML = '<option value="">— Select a job —</option>';
    state.jobs.forEach(function (job) {
      var opt = document.createElement('option');
      opt.value = job.job_id;
      opt.textContent = job.title + ' (' + job.job_id + ')';
      select.appendChild(opt);
    });
    if (current && state.jobs.some(function (j) { return j.job_id === current; })) {
      select.value = current;
    }
    updateJobFolderLink();
  }

  function updateJobFolderLink() {
    var link = $('job-folder-link');
    var job = state.jobs.find(function (j) { return j.job_id === state.selectedJobId; });
    if (job && job.resume_folder_url) {
      link.href = job.resume_folder_url;
      link.classList.remove('hidden');
    } else {
      link.classList.add('hidden');
    }
    $('btn-import').disabled = !state.selectedJobId;
  }

  function renderCandidates() {
    var body = $('candidates-body');
    $('candidates-count').textContent = state.candidates.length
      ? state.candidates.length + ' imported'
      : '';
    if (!state.candidates.length) {
      body.innerHTML = '<tr><td colspan="5" class="arm-empty">No candidates imported yet.</td></tr>';
      return;
    }
    body.innerHTML = state.candidates.map(function (c) {
      var parsed = String(c.parsed_text || '').trim() !== '';
      var hasEval = state.evaluations.some(function (e) {
        return e.candidate_id === c.candidate_id;
      });
      var status;
      if (hasEval) {
        status = '<span class="inline-flex items-center gap-1 text-emerald-700 text-xs font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Evaluated</span>';
      } else if (parsed && state.processingPhase === 'evaluate') {
        status = '<span class="inline-flex items-center gap-1 text-indigo-700 text-xs font-semibold"><span class="arm-spinner w-3 h-3"></span>Evaluating…</span>';
      } else if (parsed) {
        status = '<span class="inline-flex items-center gap-1 text-emerald-700 text-xs font-medium"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Parsed</span>';
      } else {
        status = '<span class="inline-flex items-center gap-1 text-amber-700 text-xs font-semibold"><span class="arm-spinner w-3 h-3"></span>Parsing…</span>';
      }
      return '<tr>' +
        '<td class="font-medium">' + escapeHtml(c.display_name || c.first_name) + '</td>' +
        '<td>' + escapeHtml(c.email || '—') + '</td>' +
        '<td>' + escapeHtml(c.location || '—') + '</td>' +
        '<td>' + status + '</td>' +
        '<td><a class="text-indigo-600 hover:text-indigo-800 font-medium text-sm" href="' + escapeHtml(c.resume_url) + '" target="_blank" rel="noopener">View</a></td>' +
        '</tr>';
    }).join('');
  }

  function renderSkeletonRows() {
    if (state.processingPhase !== 'evaluate') return '';
    var evalIds = {};
    state.evaluations.forEach(function (e) { evalIds[e.candidate_id] = true; });
    var pending = state.candidates.filter(function (c) {
      return String(c.parsed_text || '').trim() && !evalIds[c.candidate_id];
    });
    return pending.map(function (c) {
      return '<tr class="opacity-70">' +
        '<td><div class="arm-skeleton w-16 mx-auto"></div></td>' +
        '<td><div class="flex items-center gap-2"><span class="arm-spinner text-indigo-500"></span><span class="text-slate-500 text-sm">' + escapeHtml(c.display_name || c.first_name) + '</span></div></td>' +
        '<td><div class="arm-skeleton w-32"></div></td>' +
        '<td><div class="arm-skeleton w-24"></div></td>' +
        '<td><div class="arm-skeleton w-16"></div></td>' +
        '<td><div class="arm-skeleton w-16"></div></td>' +
        '<td><div class="arm-skeleton w-full"></div></td>' +
        '<td></td></tr>';
    }).join('');
  }

  function renderResults() {
    var body = $('results-body');
    var subtitle = $('results-subtitle');
    var evalCount = state.evaluations.length;

    subtitle.textContent = evalCount
      ? evalCount + ' candidate' + (evalCount === 1 ? '' : 's') + ' ranked by AI match score'
      : 'Candidates ranked by AI match score';

    if (!evalCount && state.processingPhase !== 'evaluate') {
      body.innerHTML = '<tr><td colspan="8" class="arm-empty">No evaluations yet. Import resumes and run Analyze to see ranked results.</td></tr>';
      return;
    }

    var rowsHtml = state.evaluations.map(function (r, idx) {
      var isNew = !state.knownEvalIds[r.evaluation_id];
      state.knownEvalIds[r.evaluation_id] = true;
      var rec = r.recommended
        ? '<span class="arm-rec-badge-yes">Yes</span>'
        : '<span class="arm-rec-badge-no">No</span>';
      var summary = escapeHtml(r.summary || '');
      if (summary.length > 140) summary = summary.slice(0, 137) + '…';

      return '<tr class="' + (isNew ? 'row-new' : '') + '" data-eval-idx="' + idx + '">' +
        '<td><button type="button" class="arm-btn arm-btn-icon details-btn" data-eval-idx="' + idx + '" title="View details">☰</button></td>' +
        '<td class="font-semibold text-slate-900">' + escapeHtml(r.display_name) + '</td>' +
        '<td class="text-slate-600">' + escapeHtml(r.email || '—') + '</td>' +
        '<td class="text-slate-600">' + escapeHtml(r.location || '—') + '</td>' +
        '<td><span class="' + scoreBadgeClass(r.overall_score) + '">' + r.overall_score + '</span></td>' +
        '<td>' + rec + '</td>' +
        '<td class="text-slate-600 text-sm leading-relaxed max-w-md">' + summary + '</td>' +
        '<td><a class="text-indigo-600 hover:text-indigo-800 font-medium text-sm" href="' + escapeHtml(r.resume_url) + '" target="_blank" rel="noopener">View ↗</a></td>' +
        '</tr>';
    }).join('');

    var skeletons = renderSkeletonRows();
    if (!rowsHtml && skeletons) {
      body.innerHTML = skeletons;
    } else if (rowsHtml) {
      body.innerHTML = rowsHtml + skeletons;
    } else {
      body.innerHTML = '<tr><td colspan="8" class="arm-empty">Waiting for first evaluation result…</td></tr>' + skeletons;
    }

    body.querySelectorAll('.details-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-eval-idx'));
        openModal(state.evaluations[idx]);
      });
    });
  }

  function renderScoreBar(label, score) {
    var pct = Math.min(100, (Number(score) / 5) * 100);
    return '<div class="mb-4">' +
      '<div class="flex justify-between text-sm mb-1.5">' +
      '<span class="font-medium text-slate-700">' + escapeHtml(label) + '</span>' +
      '<span class="font-semibold text-slate-900 tabular-nums">' + score + ' / 5</span>' +
      '</div>' +
      '<div class="arm-score-bar-track">' +
      '<div class="arm-score-bar-fill" style="width:' + pct + '%;background:' + scoreBarColor(score) + '"></div>' +
      '</div></div>';
  }

  function openModal(r) {
    if (!r) return;
    var recBadge = r.recommended
      ? '<span class="arm-rec-badge-yes ml-2">Recommended</span>'
      : '<span class="arm-rec-badge-no ml-2">Not recommended</span>';

    $('modal-header-content').innerHTML =
      '<div class="flex items-center flex-wrap gap-2">' +
      '<h3 class="text-xl font-bold text-slate-900">' + escapeHtml(r.display_name) + '</h3>' +
      recBadge +
      '</div>' +
      '<p class="text-sm text-slate-500 mt-1">' + escapeHtml(r.email || '') +
      (r.location ? ' · ' + escapeHtml(r.location) : '') + '</p>';

    var strengths = (r.strengths || []).map(function (s) {
      return '<span class="arm-list-tag strength">' + escapeHtml(s) + '</span>';
    }).join('') || '<span class="text-slate-400 text-sm">None listed</span>';

    var weaknesses = (r.weaknesses || []).map(function (w) {
      return '<span class="arm-list-tag weakness">' + escapeHtml(w) + '</span>';
    }).join('') || '<span class="text-slate-400 text-sm">None listed</span>';

    $('modal-body').innerHTML =
      '<div class="flex items-center gap-4 mb-6 p-4 rounded-xl bg-slate-50 border border-slate-100">' +
      '<span class="' + scoreBadgeClass(r.overall_score) + ' text-2xl min-w-[3.5rem]">' + r.overall_score + '</span>' +
      '<div><p class="text-sm font-semibold text-slate-700">Overall Match Score</p>' +
      '<p class="text-xs text-slate-500 mt-0.5">Weighted composite of skills, experience, seniority & education</p></div></div>' +
      '<h4 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-3">Score Breakdown</h4>' +
      renderScoreBar('Skills Match', r.skills_match) +
      renderScoreBar('Experience Match', r.experience_match) +
      renderScoreBar('Seniority Match', r.seniority_match) +
      renderScoreBar('Education Match', r.education_match) +
      '<h4 class="text-sm font-bold text-slate-800 uppercase tracking-wide mt-6 mb-2">AI Summary</h4>' +
      '<p class="text-slate-700 leading-relaxed text-sm">' + escapeHtml(r.summary) + '</p>' +
      '<h4 class="text-sm font-bold text-slate-800 uppercase tracking-wide mt-6 mb-2">Strengths</h4>' +
      '<div class="flex flex-wrap gap-1">' + strengths + '</div>' +
      '<h4 class="text-sm font-bold text-slate-800 uppercase tracking-wide mt-6 mb-2">Weaknesses</h4>' +
      '<div class="flex flex-wrap gap-1">' + weaknesses + '</div>' +
      '<div class="mt-6 pt-4 border-t border-slate-100">' +
      '<a href="' + escapeHtml(r.resume_url) + '" target="_blank" rel="noopener" class="arm-btn arm-btn-primary text-sm">View Resume ↗</a></div>';

    $('candidate-modal').classList.remove('hidden');
  }

  function closeModal() {
    $('candidate-modal').classList.add('hidden');
  }

  async function loadJobs() {
    state.jobs = await API.listJobs();
    renderJobs();
  }

  async function refreshJobData(silent) {
    if (!state.selectedJobId) {
      state.candidates = [];
      state.evaluations = [];
      state.queueStatus = null;
      state.knownEvalIds = {};
      renderCandidates();
      renderResults();
      renderProcessingBanner();
      updateAnalyzeHint();
      stopPolling();
      return;
    }

    var jobId = state.selectedJobId;
    var results = await Promise.all([
      API.getCandidatesForJob(jobId),
      API.getRankedEvaluations(jobId),
      API.getQueueStatus(jobId)
    ]);

    state.candidates = results[0] || [];
    state.evaluations = results[1] || [];
    state.queueStatus = results[2] || null;

    renderCandidates();
    renderResults();
    renderProcessingBanner();
    updateAnalyzeHint();
    managePolling();

    if (!silent && state.processingPhase === 'idle' && state.evalTracking) {
      state.evalTracking = false;
      showToast('Processing complete.');
    }
  }

  function stopPolling() {
    if (state.pollTimer) {
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  function managePolling() {
    stopPolling();
    if (!shouldPoll()) return;

    var tick = function () {
      API.processQueueNow().catch(function () {});
      refreshJobData(true).catch(function (e) { console.error(e); });
    };

    tick();
    state.pollTimer = setInterval(tick, POLL_MS);
  }

  async function loadModels(forceRefresh) {
    var freeOnly = $('free-only').checked;
    var select = $('model-select');
    select.disabled = true;
    try {
      var res = await API.listOpenRouterModels(forceRefresh === true, freeOnly);
      if (res && res.ok === false) {
        showToast(res.error || 'Could not load models', true);
        return;
      }
      if (!res || (!res.grouped && !res.models)) {
        showToast('Could not load models', true);
        return;
      }
      var current = await API.getEvaluationModel();
      select.innerHTML = '';
      (res.grouped || []).forEach(function (group) {
        var optgroup = document.createElement('optgroup');
        optgroup.label = group.provider;
        (group.models || []).forEach(function (m) {
          var opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name + (m.isFree ? ' (free)' : '');
          optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
      });
      if (current.model_id) select.value = current.model_id;
      state.modelsLoaded = true;
    } finally {
      select.disabled = false;
    }
  }

  async function onCreateJob(e) {
    e.preventDefault();
    setLoading(true, 'Creating job…');
    try {
      var job = await API.createJob({
        title: $('job-title').value.trim(),
        description: $('job-description').value.trim(),
        skills: $('job-skills').value.trim()
      });
      showToast('Job created: ' + job.title);
      $('job-form').reset();
      await loadJobs();
      state.selectedJobId = job.job_id;
      $('job-select').value = job.job_id;
      updateJobFolderLink();
      await refreshJobData(false);
    } catch (err) {
      showToast(err.message, true);
    } finally {
      setLoading(false);
    }
  }

  async function onImport() {
    if (!state.selectedJobId) return;
    setLoading(true, 'Importing resumes…');
    try {
      var res = await API.importResumesForJob(state.selectedJobId);
      showToast('Imported ' + res.imported + ' resume(s). Parsing started…');
      state.knownEvalIds = {};
      state.processingPhase = 'parse';
      setLoading(false);
      await refreshJobData(true);
      managePolling();
    } catch (err) {
      showToast(err.message, true);
      setLoading(false);
    }
  }

  async function onAnalyze() {
    if (!state.selectedJobId) return;
    var parsed = state.candidates.filter(function (c) {
      return String(c.parsed_text || '').trim() !== '';
    }).length;
    if (!parsed) {
      showToast('No parsed candidates ready yet.', true);
      return;
    }
    if (!confirm('Start AI evaluation for ' + parsed + ' parsed candidate(s)?')) return;
    try {
      var res = await API.startAnalysis(state.selectedJobId);
      showToast('Evaluating ' + res.enqueued + ' candidate(s)… Results will appear below as they finish.');
      state.evalTracking = true;
      state.processingPhase = 'evaluate';
      await refreshJobData(true);
      managePolling();
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function onModelChange() {
    var modelId = $('model-select').value;
    if (!modelId) return;
    try {
      await API.setEvaluationModel(modelId);
      showToast('Model updated');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  function bindEvents() {
    $('job-form').addEventListener('submit', onCreateJob);
    $('job-select').addEventListener('change', function () {
      state.selectedJobId = $('job-select').value;
      state.knownEvalIds = {};
      state.evalTracking = false;
      updateJobFolderLink();
      refreshJobData(false).catch(function (e) { showToast(e.message, true); });
    });
    $('btn-import').addEventListener('click', onImport);
    $('btn-analyze').addEventListener('click', onAnalyze);
    $('btn-refresh-results').addEventListener('click', function () {
      refreshJobData(false).catch(function (e) { showToast(e.message, true); });
    });
    $('btn-refresh-models').addEventListener('click', function () {
      loadModels(true).catch(function (e) { showToast(e.message, true); });
    });
    $('free-only').addEventListener('change', function () {
      loadModels(true).catch(function (e) { showToast(e.message, true); });
    });
    $('model-select').addEventListener('change', onModelChange);
    $('btn-repair-triggers').addEventListener('click', function () {
      setLoading(true, 'Repairing…');
      var chain = API.repairTriggers();
      if (state.selectedJobId) {
        chain = chain.then(function () {
          return API.reprocessFailedQueue(state.selectedJobId);
        });
      }
      chain
        .then(function () {
          showToast('Triggers repaired. Reprocessing failed tasks…');
          return refreshJobData(false);
        })
        .catch(function (e) { showToast(e.message, true); })
        .finally(function () { setLoading(false); });
    });
    $('modal-close').addEventListener('click', closeModal);
    $('candidate-modal').addEventListener('click', function (e) {
      if (e.target === $('candidate-modal')) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  }

  async function init() {
    bindEvents();
    setLoading(true, 'Loading…');
    try {
      await API.bootstrapApp();
      await Promise.all([loadJobs(), loadModels(false)]);
    } catch (err) {
      showToast(err.message, true);
    } finally {
      setLoading(false);
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
